model:
  model_name: cachejpeg_rosetta
  max_length: 12000
  rosetta_config:
    base_model: Qwen/Qwen3-0.6B
    base_model_local_dir: /home/ubuntu/.cache/huggingface/hub/models--Qwen--Qwen3-0.6B/snapshots/c1899de289a04d12100db370d81485cdf75e47ca
    teacher_model: Qwen/Qwen2.5-1.5B-instruct
    teacher_model_local_dir: /data/smy_data/local/models/Qwen2.5-1.5B-Instruct
    checkpoints_dir: local/checkpoints/0.6+1.5B_latent_kv_split_adaptive_quant_longbench_e
  cachejpeg_rosetta_config:
    fusion_type: latent_kv_split
    latent_kv_bridge:
      enabled: true
      latent_dim: 128
      mlp_ratio: 4.0
      dropout: 0.0
      use_head_scale: true
      use_layer_gate: true
      gate_mode: sigmoid
      gate_init: -4.0
      residual_scale_init: 0.0
      layer_mapping: proportional
      share_adapter_across_layers: false
    adaptive_quant_table:
      enabled: true
      feature_bands: 8
      hidden_dim: 128
      alpha_candidates: [0.125, 0.25, 0.5, 1.0, 2.0, 4.0]
      initial_alpha_index: 0
      q_base_min: 1.0
      q_base_max: 8.0
      q_base_power: 1.0
      scale_side_info_bits: 16
    transport: {mode: none}
    codec:
      method: cachejpeg
      compute: {backend: gpu, transform_dtype: float32}
      entropy: {representation: adaptive_int, backend: lz4}
  generation_config: {do_sample: false, max_new_tokens: 2048}
output:
  output_dir: local/final_results/0.6+1.5B_latent_kv_split_adaptive_quant
eval:
  dataset: longbench
  longbench_e: true
  longbench_e_test_subset:
    enabled: false
    size: 200
    seed: 42
  longbench_local_data_dir: /data/smy/KVCache-Factory/data/LongBench
  rosetta_checkpoint_subfolder: final
  skip_existing_longbench_subjects: true
  longbench_prompt_format_path: longbench/config/dataset2prompt.json
  longbench_maxlen_format_path: longbench/config/dataset2maxlen.json
  gpu_ids: [1]
  answer_method: generate
  use_cot: false
  use_template: true
  sample_interval: 1
