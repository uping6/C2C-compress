model:
  model_name: Rosetta
  max_length: 12000
  rosetta_config:
    base_model: Qwen/Qwen3-0.6B
    teacher_model: Qwen/Qwen2.5-0.5B-Instruct
    is_do_alignment: false
    alignment_strategy: "longest"
    checkpoints_dir: local/checkpoints/0.6+0.5B_C2C_longbench_e/final
  generation_config:
    do_sample: false
    max_new_tokens: 2048

output:
  output_dir: local/final_results/0.6+0.5B_C2C_longbench_e

eval:
  dataset: longbench
  longbench_e: true
  longbench_prompt_format_path: longbench/config/dataset2prompt.json
  longbench_maxlen_format_path: longbench/config/dataset2maxlen.json
  gpu_ids: [0]
  answer_method: generate
  use_cot: false
  use_template: true
  sample_interval: 1
