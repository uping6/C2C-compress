model:
  model_name: cachejpeg_rosetta
  max_length: 12000
  rosetta_config:
    base_model: Qwen/Qwen3-0.6B
    teacher_model: Qwen/Qwen2.5-1.5B-Instruct
    checkpoints_dir: local/checkpoints/0.6+1.5B_latent_kv_joint_adaptive_quant_longbench_e
  cachejpeg_rosetta_config:
    fusion_type: latent_kv_joint
    latent_kv_bridge: {enabled: true, latent_dim: 128, layer_mapping: proportional}
    adaptive_quant_table:
      enabled: true
      feature_bands: 8
      hidden_dim: 128
      alpha_candidates: [0.125, 0.25, 0.5, 1.0, 2.0, 4.0]
      initial_alpha_index: 0
      q_base_min: 1.0
      q_base_max: 8.0
      q_base_power: 1.0
      scale_side_info_bits: 16
    transport: {mode: none}
    codec:
      method: cachejpeg
      compute: {backend: gpu, transform_dtype: float32}
      entropy: {representation: adaptive_int, backend: lz4}
  generation_config: {do_sample: false, max_new_tokens: 2048}
output:
  output_dir: local/final_results/0.6+1.5B_latent_kv_joint_adaptive_quant
eval:
  dataset: longbench
  longbench_e: true
  rosetta_checkpoint_subfolder: final
  skip_existing_longbench_subjects: false
  longbench_prompt_format_path: longbench/config/dataset2prompt.json
  longbench_maxlen_format_path: longbench/config/dataset2maxlen.json
  gpu_ids: [0]
  answer_method: generate
  use_cot: false
  use_template: true
  sample_interval: 1
