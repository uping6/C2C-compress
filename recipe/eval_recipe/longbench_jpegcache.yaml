model:
  model_name: cachejpeg
  max_length: 12000
  rosetta_config:
    base_model: Qwen/Qwen3-0.6B
    checkpoints_dir: ~/.cache/huggingface/hub/models--Qwen--Qwen3-0.6B/snapshots/c1899de289a04d12100db370d81485cdf75e47ca
    teacher_model: Qwen/Qwen2.5-0.5B-Instruct
    is_do_alignment: false
    alignment_strategy: "longest"
    # Checkpoint root directory. The actual subfolder is selected by eval.rosetta_checkpoint_subfolder.
    checkpoints_dir: local/checkpoints/0.6+0.5B_C2C_longbench_e
  cachejpeg_config:
    method: cachejpeg
    homo_c2c_kv_src: /data/smy/HomoC2C-KV/src
    anchors:
      sink_count: 1
      recent_count: 0
      preserve_options: false
    block:
      mode: global
      size: 64
    quant:
      q_global: 1.0
      low: 1.0
      high: 8.0
      curve: quadratic
      key_scale: 1.0
      value_scale: 1.0
      layer_group_scales:
        early: 1.0
        middle: 1.0
        late: 1.0
      clip_int16: true
    zero_tail:
      mode: none
      ratio: 0.0
      min_keep: 1
    entropy:
      representation: dense_int16
      backend: zlib6
  generation_config:
    do_sample: false
    max_new_tokens: 2048

output:
  # All evaluation artifacts are written under this directory.
  output_dir: local/final_results/0.6+0.5B_C2C_longbench_e_1850_cachejpeg

eval:
  dataset: longbench
  longbench_e: false
  longbench_local_data_dir: /data/smy/KVCache-Factory/data/LongBench
  # Switch between final, checkpoint-1000, checkpoint-2000, etc.
  rosetta_checkpoint_subfolder: checkpoint-1850
  # If a subject's jsonl already exists, skip regenerating that subject and move on.
  skip_existing_longbench_subjects: false
  longbench_prompt_format_path: longbench/config/dataset2prompt.json
  longbench_maxlen_format_path: longbench/config/dataset2maxlen.json
  gpu_ids: [0]
  answer_method: generate
  use_cot: false
  use_template: true
  sample_interval: 1
